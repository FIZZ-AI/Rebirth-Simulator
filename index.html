<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投胎模拟器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 封面页 -->
    <div id="cover-page" class="page active">
        <div class="cover-content">
            <h1 class="game-title">投胎模拟器</h1>
            <div class="mode-picker">
                <label for="game-mode">选择玩法</label>
                <select id="game-mode">
                    <option value="deepseek">AI 模式 · 作者提供，无需账号或密钥</option>
                    <option value="classic">经典模式 · 无需联网</option>
                    <option value="ai">AI 模式 · PlayKit（需登录与积分）</option>
                </select>
                <p id="mode-description">AI 生成人生故事和人物照片，无需注册或填写密钥。文字与照片合计共享每天 100 次请求。</p>
                <details id="ai-settings" hidden>
                    <summary>AI 设置（开发者可选）</summary>
                    <label for="game-id">PlayKit Game ID</label>
                    <input id="game-id" value="46b3ff0f-be0d-47af-a685-ca14a09d104a" autocomplete="off">
                    <label for="text-model">文字模型</label>
                    <input id="text-model" value="gpt-4o" autocomplete="off">
                    <label for="image-model">图片模型</label>
                    <input id="image-model" value="flux-1-schnell" autocomplete="off">
                    <label for="developer-token">开发者令牌（留空使用玩家登录）</label>
                    <input id="developer-token" type="password" autocomplete="off" placeholder="仅本次页面使用，不保存">
                </details>
            </div>
            <button id="start-game-btn" class="btn btn-primary">开始游戏</button>
            <div class="cover-footer">
                <p class="guide-text">每次出生，都是一个新的故事</p>
                <p class="author">经典模式可离线 · AI 故事支持 DeepSeek / PlayKit</p>
            </div>
        </div>
    </div>

    <!-- 出生初始化页 -->
    <div id="init-page" class="page">
        <div class="init-content">
            <h2>设定你的出生</h2>
            <div class="form-group">
                <label for="birth-year">出生年份</label>
                <input type="number" id="birth-year" min="1900" max="2100" step="1" required placeholder="例如 1990">
            </div>
            <div class="form-group">
                <label for="birth-place">出生地点</label>
                <input type="text" id="birth-place" maxlength="80" placeholder="例如 深圳">
            </div>
            <div class="form-group">
                <label for="baby-wish">婴儿寄语</label>
                <textarea id="baby-wish" maxlength="500" rows="4" placeholder="小孩子也许看不懂，但会在心里种下一颗种子"></textarea>
            </div>
            <button id="enter-world-btn" class="btn btn-primary">进入世界</button>
        </div>
    </div>

    <!-- 核心游戏页 -->
    <div id="game-page" class="page">
        <div class="game-layout">
            <!-- 左侧：世界演变区 -->
            <div class="world-section">
                <p id="active-mode" class="mode-badge"></p><h3>世界背景</h3>
                <div id="world-year" class="info-item"></div>
                <div id="world-place" class="info-item"></div>
                <div id="world-context" class="context-text"></div>
            </div>

            <!-- 中间：主角人生故事区 -->
            <div class="life-section">
                <h3>人生故事</h3>
                <div id="current-age" class="age-display"></div>
                <div id="life-event" class="event-text"></div><p id="game-notice" role="status"></p><button id="back-cover-btn" class="btn btn-secondary back-cover">返回封面</button><details class="history"><summary>查看人生记录</summary><div id="life-history"></div></details>
                <div class="age-control">
                    <label for="target-age">下一站年龄（1–100 岁）</label>
                    <input id="target-age" type="number" min="1" max="100" step="1" value="5">
                </div>
                <div class="action-buttons">
                    <button id="advance-age-btn" class="btn btn-primary">推进年龄</button>
                    <button id="intervene-btn" class="btn btn-secondary">介入人生</button>
                    <button id="ask-question-btn" class="btn btn-secondary">提问</button>
                </div>
            </div>

            <!-- 右侧：属性和照片区 -->
            <div class="stats-section">
                <div class="stats-panel">
                    <h3>角色属性</h3>
                    <div class="stat-item">
                        <span class="stat-label">年龄：</span>
                        <span id="stat-age" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">健康：</span>
                        <span id="stat-health" class="stat-value">100</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">财富：</span>
                        <span id="stat-wealth" class="stat-value">$0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">剩余介入：</span>
                        <span id="stat-interventions" class="stat-value">3</span>
                    </div>
                </div>
                <div class="photo-panel">
                    <h3 id="photo-title">AI 人物照片</h3>
                    <div id="current-photo" class="photo-container"></div>
                    <button id="retry-photo-btn" class="btn btn-secondary" hidden>重试照片</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 结算页 -->
    <div id="end-page" class="page">
        <div class="end-content">
            <h2>人生落幕</h2>
            <p id="end-notice" role="status"></p><button id="retry-summary-btn" class="btn btn-secondary" hidden>重试 AI 总结</button><div id="life-summary" class="summary-text"></div>
            <div class="final-stats">
                <p>最终财富：<span id="final-wealth"></span></p>
            </div>
            <div id="photo-gallery" class="photo-gallery"></div>
            <div id="life-poem" class="poem-text"></div>
            <button id="restart-btn" class="btn btn-primary">重新开始</button>
        </div>
    </div>

    <!-- 加载提示 -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p id="loading-message">加载中...</p>
    </div>

    <!-- 错误提示 -->
    <div id="error-toast" class="error-toast" role="alert"></div>

    <!-- 介入输入弹窗 -->
    <div id="intervene-modal" class="modal">
        <div class="modal-content">
            <h3>介入人生</h3>
            <p>输入你的建议（来自未来的你）：</p>
            <textarea id="intervene-input" maxlength="500" rows="4" placeholder="例如：多读书、去创业、注意健康..."></textarea>
            <div class="modal-buttons">
                <button id="intervene-confirm-btn" class="btn btn-primary">确认</button>
                <button id="intervene-cancel-btn" class="btn btn-secondary">取消</button>
            </div>
        </div>
    </div>

    <!-- 提问弹窗 -->
    <div id="question-modal" class="modal">
        <div class="modal-content">
            <h3>提问</h3>
            <p>你想问什么？</p>
            <textarea id="question-input" maxlength="500" rows="3" placeholder="例如：我现在过得开心吗？"></textarea>
            <div class="modal-buttons">
                <button id="question-confirm-btn" class="btn btn-primary">提问</button>
                <button id="question-cancel-btn" class="btn btn-secondary">取消</button>
            </div>
            <div id="question-answer" class="answer-text"></div>
        </div>
    </div>

    <!-- 经典模式不加载任何外部资源；PlayKit 仅在选择 AI 模式后加载。 -->
    <script src="service-config.js"></script>
    <script src="classic.js"></script>
    <!-- 游戏逻辑 -->
    <script src="game.js"></script>
</body>
</html>
